<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thulo Studio — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F6F6F3;
  --surface:#FFFFFF;
  --ink:#181A1E;
  --ink-soft:#5B5E66;
  --ink-faint:#9A9CA3;
  --border:#E6E5E0;
  --border-soft:#EFEEEA;
  --accent:#EE501F;
  --accent-ink:#FFFFFF;
  --accent-soft:#FDE7DD;
  --accent-soft-ink:#B03D14;
  --success:#1D7A56;
  --success-soft:#E1F3EA;
  --warning:#B4740E;
  --warning-soft:#FBEED9;
  --danger:#C7382E;
  --danger-soft:#FBE5E3;
  --info:#2E5AA8;
  --info-soft:#E4EBF8;
  --radius:12px;
  --shadow-sm: 0 1px 2px rgba(24,26,30,0.04), 0 1px 1px rgba(24,26,30,0.03);
  --shadow-md: 0 4px 16px rgba(24,26,30,0.06), 0 1px 2px rgba(24,26,30,0.05);
  --shadow-lg: 0 12px 32px rgba(24,26,30,0.12), 0 2px 6px rgba(24,26,30,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'JetBrains Mono',monospace;}
h1,h2,h3,.display{font-family:'Archivo',sans-serif;letter-spacing:-0.01em;}
.eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--ink-faint);
  font-weight:500;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#D8D6D0;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- APP SHELL ---------- */
#app{display:flex;min-height:100vh;}

/* Sidebar */
#sidebar{
  width:236px;flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:20px 20px 16px 20px;
}
.brand-tag{
  width:30px;height:30px;background:var(--ink);border-radius:7px;
  position:relative;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.brand-tag::after{
  content:'';position:absolute;top:5px;right:5px;width:4px;height:4px;
  background:var(--accent);border-radius:50%;
}
.brand-tag svg{width:16px;height:16px;}
.brand-name{font-family:'Archivo',sans-serif;font-weight:800;font-size:15.5px;line-height:1.1;}
.brand-sub{font-size:10.5px;color:var(--ink-faint);font-family:'JetBrains Mono',monospace;letter-spacing:0.04em;}

.nav-group{padding:8px 12px;}
.nav-label{
  padding:14px 10px 6px 10px;font-size:10.5px;text-transform:uppercase;
  letter-spacing:0.08em;color:var(--ink-faint);font-weight:600;
}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;
  color:var(--ink-soft);font-weight:500;font-size:13.5px;margin-bottom:1px;
  position:relative;transition:background .12s ease, color .12s ease;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:0.85;}
.nav-item:hover{background:var(--bg);color:var(--ink);}
.nav-item.active{background:var(--ink);color:#fff;}
.nav-item.active svg{opacity:1;}
.nav-badge{
  margin-left:auto;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;
  padding:1px 6px;border-radius:20px;font-family:'JetBrains Mono',monospace;
}
.nav-item.active .nav-badge{background:rgba(255,255,255,0.22);}

.sidebar-footer{
  margin-top:auto;padding:14px;border-top:1px solid var(--border-soft);
  display:flex;align-items:center;gap:10px;
}
.avatar{
  width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent-soft-ink);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;
}
.sf-name{font-size:12.5px;font-weight:600;}
.sf-role{font-size:11px;color:var(--ink-faint);}

/* Main */
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  height:60px;flex-shrink:0;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 28px;
  background:rgba(246,246,243,0.85);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20;
}
.topbar-title{font-family:'Archivo',sans-serif;font-weight:700;font-size:17px;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.search-box{
  display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:7px 12px;width:230px;color:var(--ink-faint);font-size:13px;
}
.search-box svg{width:15px;height:15px;flex-shrink:0;}
.icon-btn{
  width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft);position:relative;
}
.icon-btn svg{width:16px;height:16px;}
.icon-dot{position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--accent);border:1.5px solid var(--surface);}

#content{padding:28px;flex:1;overflow-y:auto;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.page-head h1{font-size:22px;margin:0 0 3px 0;font-weight:800;}
.page-sub{color:var(--ink-soft);font-size:13.5px;margin:0;}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:8px;
  font-size:13px;font-weight:600;border:1px solid transparent;transition:transform .08s ease, filter .12s ease;
}
.btn svg{width:15px;height:15px;}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--border);}
.btn-secondary:hover{background:var(--bg);}
.btn-ghost{background:transparent;color:var(--ink-soft);}
.btn-ghost:hover{background:var(--bg);color:var(--ink);}
.btn-sm{padding:6px 11px;font-size:12.5px;}
.btn-danger-outline{background:var(--surface);color:var(--danger);border-color:#F0C7C3;}

/* Cards */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
}
.card-pad{padding:18px 20px;}

/* Dashboard cards */
.stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px;}
.stat-card{padding:16px 18px;position:relative;overflow:hidden;}
.stat-icon{
  width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;
}
.stat-icon svg{width:16px;height:16px;}
.stat-value{font-family:'Archivo',sans-serif;font-size:26px;font-weight:800;line-height:1;margin-bottom:4px;}
.stat-label{font-size:12px;color:var(--ink-soft);font-weight:500;}
.stat-trend{position:absolute;top:16px;right:16px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;}
.trend-up{background:var(--success-soft);color:var(--success);}
.trend-down{background:var(--danger-soft);color:var(--danger);}

.dash-lower{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;}
.section-title{font-size:14.5px;font-weight:700;margin:0 0 2px 0;}
.section-sub{font-size:12px;color:var(--ink-faint);margin:0 0 14px 0;}

.activity-item{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--border-soft);}
.activity-item:last-child{border-bottom:none;}
.activity-dot{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.activity-dot svg{width:14px;height:14px;}
.activity-text{font-size:13px;line-height:1.4;}
.activity-time{font-size:11px;color:var(--ink-faint);margin-top:2px;}

/* Tag / offer badge — signature element: a price-tag shape with a punch hole */
.price-tag{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  color:var(--accent-soft-ink);background:var(--accent-soft);
  padding:3px 9px 3px 7px;border-radius:3px 8px 8px 3px;position:relative;
  font-family:'JetBrains Mono',monospace;letter-spacing:0.01em;
}
.price-tag::before{
  content:'';width:5px;height:5px;border-radius:50%;background:var(--surface);
  border:1.5px solid var(--accent-soft-ink);flex-shrink:0;
}

/* Pills / status badges */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
.pill-dot{width:6px;height:6px;border-radius:50%;}
.pill-neutral{background:#EFEEEA;color:var(--ink-soft);}
.pill-success{background:var(--success-soft);color:var(--success);}
.pill-warning{background:var(--warning-soft);color:var(--warning);}
.pill-danger{background:var(--danger-soft);color:var(--danger);}
.pill-info{background:var(--info-soft);color:var(--info);}

/* Tables */
table{width:100%;border-collapse:collapse;}
.tbl th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-faint);
  padding:10px 14px;border-bottom:1px solid var(--border);font-weight:600;user-select:none;white-space:nowrap;
}
.tbl th.sortable{cursor:pointer;}
.tbl th.sortable:hover{color:var(--ink);}
.tbl th .sort-arrow{margin-left:4px;opacity:0.5;font-size:9px;}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--border-soft);font-size:13px;vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tbody tr{transition:background .1s ease;}
.tbl tbody tr.clickable:hover{background:var(--bg);cursor:pointer;}
.thumb{width:38px;height:38px;border-radius:7px;object-fit:cover;background:#EEEDE8;flex-shrink:0;}
.td-flex{display:flex;align-items:center;gap:10px;}
.td-title{font-weight:600;}
.td-sub{font-size:11.5px;color:var(--ink-faint);}
.expand-row td{background:#FBFBF9;padding:0;}
.variant-table{margin:10px 16px 14px 52px;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.variant-table table{background:var(--surface);}
.variant-table th, .variant-table td{padding:8px 12px;font-size:12.5px;}
.chevron{transition:transform .15s ease;display:inline-flex;}
.chevron.open{transform:rotate(90deg);}

/* Empty / loading states */
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:60px 20px;color:var(--ink-soft);
}
.empty-state .es-icon{
  width:52px;height:52px;border-radius:14px;background:var(--bg);display:flex;align-items:center;
  justify-content:center;margin-bottom:14px;color:var(--ink-faint);
}
.empty-state .es-icon svg{width:24px;height:24px;}
.empty-state h3{margin:0 0 5px 0;font-size:14.5px;}
.empty-state p{margin:0;font-size:12.5px;color:var(--ink-faint);max-width:260px;}

.skeleton{background:linear-gradient(100deg,#EDECE8 30%,#F5F4F0 50%,#EDECE8 70%);background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:6px;}
@keyframes shimmer{0%{background-position:0% 0;}100%{background-position:-200% 0;}}

/* ---------- INBOX ---------- */
.inbox-wrap{display:flex;height:calc(100vh - 148px);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface);}
.conv-list{width:300px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;}
.conv-search{padding:12px;border-bottom:1px solid var(--border-soft);}
.channel-tabs{display:flex;gap:6px;padding:10px 12px 0 12px;overflow-x:auto;scrollbar-width:none;}
.channel-tabs::-webkit-scrollbar{display:none;}
.channel-tab{
  display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:600;
  color:var(--ink-soft);background:var(--bg);border:1px solid transparent;flex-shrink:0;cursor:pointer;
}
.channel-tab svg{width:13px;height:13px;flex-shrink:0;}
.channel-tab:hover{background:#EFEEEA;}
.channel-tab.active{background:var(--ink);color:#fff;}
.channel-tab .ct-count{font-family:'JetBrains Mono',monospace;font-size:10.5px;opacity:0.7;}
.conv-scroll{overflow-y:auto;flex:1;}
.conv-item{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border-soft);position:relative;align-items:flex-start;}
.conv-item:hover{background:var(--bg);cursor:pointer;}
.conv-item.active{background:var(--accent-soft);}
.conv-avatar-wrap{position:relative;width:38px;height:38px;flex-shrink:0;}
.conv-avatar{width:38px;height:38px;border-radius:50%;background:#EFEEEA;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--ink-soft);flex-shrink:0;}
.channel-badge{
  position:absolute;bottom:0px;right:-1px;width:15px;height:15px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;border:1.5px solid var(--surface);color:#fff;z-index:2;
}
.channel-badge svg{width:9px;height:9px;flex-shrink:0;}
.channel-badge.ig{background:linear-gradient(135deg,#F58529,#DD2A7B,#8134AF);}
.channel-badge.wa{background:#25D366;}
.conv-item.active .channel-badge{border-color:var(--accent-soft);}
.conv-body{min-width:0;flex:1;}
.conv-top{display:flex;justify-content:space-between;gap:6px;align-items:center;}
.conv-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conv-time-wrap{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.conv-handle{font-size:11px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conv-time{font-size:10.5px;color:var(--ink-faint);flex-shrink:0;}
.conv-preview{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.unread-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;flex-shrink:0;box-shadow:0 0 0 1.5px var(--surface), 0 0 6px rgba(238,80,31,0.5);}

.thread{flex:1;display:flex;flex-direction:column;min-width:0;}
.thread-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.thread-head-info{display:flex;align-items:center;gap:10px;}
.thread-messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;}
.msg{max-width:62%;padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.4;}
.msg.in{background:var(--bg);border-bottom-left-radius:4px;align-self:flex-start;}
.msg.out{background:var(--ink);color:#fff;border-bottom-right-radius:4px;align-self:flex-end;}
.msg-time{font-size:10px;color:var(--ink-faint);margin-top:4px;}
.thread-input{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;}
.thread-input input{flex:1;border:1px solid var(--border);border-radius:20px;padding:9px 16px;font-size:13px;font-family:inherit;outline:none;}
.thread-input input:focus{border-color:var(--ink-faint);}

/* Side panel (create order) */
.overlay{position:fixed;inset:0;background:rgba(20,20,18,0.32);z-index:40;display:none;align-items:stretch;justify-content:flex-end;}
.overlay.show{display:flex;}
.panel{width:460px;max-width:92vw;background:var(--surface);height:100%;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slideIn .18s ease;}
@keyframes slideIn{from{transform:translateX(24px);opacity:0;}to{transform:translateX(0);opacity:1;}}
.panel-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.panel-body{flex:1;overflow-y:auto;padding:18px 20px;}
.panel-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;}
.close-x{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}
.close-x:hover{background:var(--bg);}

.pick-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:9px;margin-bottom:8px;}
.pick-info{flex:1;min-width:0;}
.pick-name{font-weight:600;font-size:13px;}
.pick-meta{font-size:11.5px;color:var(--ink-faint);}
.price-block{text-align:right;}
.price-strike{font-size:11.5px;color:var(--ink-faint);text-decoration:line-through;}
.price-now{font-weight:700;font-size:13.5px;color:var(--accent-soft-ink);}
.price-reg{font-weight:700;font-size:13.5px;}

/* Modal (centered) */
.modal-overlay{position:fixed;inset:0;background:rgba(20,20,18,0.32);z-index:50;display:none;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{width:640px;max-width:92vw;max-height:88vh;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;animation:pop .15s ease;}
@keyframes pop{from{transform:scale(.97);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-body{padding:20px 22px;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;}

/* Forms */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:13px;
  font-family:inherit;outline:none;background:var(--surface);color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink-faint);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.image-upload-row{display:flex;align-items:center;gap:14px;}
.image-preview{
  width:64px;height:64px;border-radius:10px;background-color:var(--bg);background-size:cover;background-position:center;
  border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);
}
.image-preview svg{width:22px;height:22px;}
.image-upload-actions{display:flex;flex-direction:column;align-items:flex-start;gap:6px;}
#pmImgFile{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
.image-upload-actions label.btn{margin:0;}
.variant-editor{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface);}
.variant-form-head{
  display:grid;grid-template-columns:1fr 1fr 0.8fr 0.8fr 32px;gap:8px;align-items:center;
  padding:9px 12px;background:var(--bg);border-bottom:1px solid var(--border);
}
.variant-form-head span{font-size:10.5px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.05em;}
#variantRows{padding:8px;}
.variant-row{
  display:grid;grid-template-columns:1fr 1fr 0.8fr 0.8fr 32px;gap:8px;align-items:center;padding:4px;border-radius:8px;
}
.variant-row:hover{background:var(--bg);}
.variant-row:not(:last-child){margin-bottom:6px;}
.variant-row input{
  width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;
  font-family:inherit;outline:none;background:var(--surface);color:var(--ink);min-width:0;
}
.variant-row input:focus{border-color:var(--ink-faint);}
.variant-remove-btn{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
  color:var(--ink-faint);display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.variant-remove-btn svg{width:14px;height:14px;}
.variant-remove-btn:hover{background:var(--danger-soft);color:var(--danger);border-color:#F0C7C3;}
.variant-editor-foot{padding:8px 12px;border-top:1px solid var(--border-soft);background:var(--bg);}
.variant-editor-foot .btn{width:100%;justify-content:center;}
.offer-editor{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface);}
.offer-form-head{
  display:grid;grid-template-columns:1.5fr 0.9fr 0.8fr 0.9fr 32px;gap:8px;align-items:center;
  padding:9px 12px;background:var(--bg);border-bottom:1px solid var(--border);
}
.offer-form-head span{font-size:10.5px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.05em;}
#offerItemRows{padding:8px;}
.offer-row{
  display:grid;grid-template-columns:1.5fr 0.9fr 0.8fr 0.9fr 32px;gap:8px;align-items:center;padding:6px 4px;border-radius:8px;
}
.offer-row:hover{background:var(--bg);}
.offer-row:not(:last-child){margin-bottom:6px;}
.offer-row select, .offer-row input{
  width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;
  font-family:inherit;outline:none;background:var(--surface);color:var(--ink);min-width:0;
}
.offer-row select:focus, .offer-row input:focus{border-color:var(--ink-faint);}
.offer-product-name{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.offer-price-preview{display:flex;flex-direction:column;line-height:1.25;}
.offer-price-preview .was{font-size:10.5px;color:var(--ink-faint);text-decoration:line-through;}
.offer-price-preview .now{font-size:12.5px;font-weight:700;color:var(--accent-soft-ink);font-family:'JetBrains Mono',monospace;}
.offer-editor-foot{padding:9px 12px;border-top:1px solid var(--border-soft);background:var(--bg);display:flex;gap:8px;}
.offer-editor-foot select{flex:1;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:var(--surface);color:var(--ink);}
.offer-editor-empty{padding:18px 12px;text-align:center;color:var(--ink-faint);font-size:12.5px;}
.chip-row{display:flex;flex-wrap:wrap;gap:7px;}
.chip{padding:6px 12px;border:1px solid var(--border);border-radius:20px;font-size:12px;font-weight:500;color:var(--ink-soft);}
.chip.sel{background:var(--ink);color:#fff;border-color:var(--ink);}

/* Order detail */
.order-grid{display:grid;grid-template-columns:2fr 1.2fr;gap:16px;}
.timeline{display:flex;align-items:center;margin:8px 0 4px 0;}
.tl-step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;}
.tl-dot{width:26px;height:26px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;z-index:2;}
.tl-dot svg{width:13px;height:13px;color:#fff;}
.tl-step.done .tl-dot{background:var(--success);}
.tl-step.current .tl-dot{background:var(--accent);}
.tl-line{position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--border);z-index:1;}
.tl-step.done .tl-line{background:var(--success);}
.tl-label{font-size:11px;margin-top:6px;font-weight:600;color:var(--ink-soft);text-align:center;}
.tl-step.done .tl-label, .tl-step.current .tl-label{color:var(--ink);}

.summary-row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;}
.summary-row.total{border-top:1px solid var(--border);margin-top:6px;padding-top:11px;font-weight:700;font-size:14.5px;}
.summary-row.discount{color:var(--accent-soft-ink);}

/* Reports */
.report-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px;}
.chart-box{position:relative;height:260px;}
.top-prod-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft);}
.top-prod-row:last-child{border-bottom:none;}
.rank-badge{width:20px;height:20px;border-radius:5px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-soft);flex-shrink:0;}

/* Attendance / employee */
.emp-card{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--border-soft);}
.emp-card:last-child{border-bottom:none;}
.emp-avatar{width:40px;height:40px;border-radius:50%;background:var(--info-soft);color:var(--info);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;}
.tab{padding:9px 4px;margin-right:20px;font-size:13.5px;font-weight:600;color:var(--ink-faint);border-bottom:2px solid transparent;position:relative;top:1px;}
.tab.active{color:var(--ink);border-color:var(--ink);}
.tab:hover{color:var(--ink);cursor:pointer;}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.hidden{display:none !important;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:12px 20px;border-radius:9px;font-size:13px;font-weight:500;z-index:100;box-shadow:var(--shadow-lg);
  display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

@media (max-width: 980px){
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .dash-lower, .order-grid, .report-grid, .grid-2{grid-template-columns:1fr;}
  #sidebar{width:72px;}
  .brand-name,.brand-sub,.nav-item span:not(.nav-badge),.nav-label,.sf-name,.sf-role{display:none;}
  .nav-item{justify-content:center;}
  .conv-list{width:230px;}
  .modal{width:96vw;}
  .field-row{grid-template-columns:1fr;}
  .variant-form-head{display:none;}
  #variantRows{padding:10px;}
  .variant-row{grid-template-columns:1fr 1fr;grid-template-areas:"size color" "stock reorder" "remove remove";gap:8px;padding:10px;border:1px solid var(--border);border-radius:9px;}
  .variant-row:not(:last-child){margin-bottom:10px;}
  .variant-row input:nth-child(1){grid-area:size;}
  .variant-row input:nth-child(2){grid-area:color;}
  .variant-row input:nth-child(3){grid-area:stock;}
  .variant-row input:nth-child(4){grid-area:reorder;}
  .variant-remove-btn{grid-area:remove;width:100%;}
  .offer-form-head{display:none;}
  #offerItemRows{padding:10px;}
  .offer-row{grid-template-columns:1fr 1fr;grid-template-areas:"name name" "type value" "preview remove";gap:8px;padding:10px;border:1px solid var(--border);border-radius:9px;}
  .offer-row:not(:last-child){margin-bottom:10px;}
  .offer-row .offer-product-name{grid-area:name;white-space:normal;}
  .offer-row select{grid-area:type;}
  .offer-row input{grid-area:value;}
  .offer-row .offer-price-preview{grid-area:preview;}
  .offer-row .variant-remove-btn{grid-area:remove;width:100%;}
}
</style>
</head>

function offerForProduct(pid){
  return OFFERS.find(o=>o.status==='active' && o.items.some(it=>it.productId===pid));
}
function offerItemForProduct(pid){
  const off = offerForProduct(pid);
  if(!off) return null;
  return off.items.find(it=>it.productId===pid);
}
function discountedPrice(product){
  const item = offerItemForProduct(product.id);
  if(!item) return product.price;
  if(item.type==='percent') return Math.round(product.price*(1-item.value/100));
  if(item.type==='flat') return Math.max(0, product.price - item.value);
  return product.price;
}

function renderCreateOrderPanel(){
  const conv = STATE.pendingOrderConv;
  const rows = PRODUCTS.map(p=>{
    const off = offerForProduct(p.id);
    const dp = discountedPrice(p);
    return `<div class="pick-row">
      <img src="${p.img}" class="thumb">
      <div class="pick-info">
        <div class="pick-name">${p.name} ${off?`<span class="price-tag">ON OFFER</span>`:''}</div>

        ${off?`<div class="price-strike">${fmtNPR(p.price)}</div><div class="price-now">${fmtNPR(dp)}</div>`:`<div class="price-reg">${fmtNPR(p.price)}</div>`}
      </div>
      <button class="btn btn-secondary btn-sm" onclick="pickVariant('${p.id}')">Select</button>
    </div>`;
  }).join('');

  const summary = STATE.pendingOrderItems.map((it,idx)=>{
    return `<div class="summary-row"><span>${it.qty} × ${it.name} (${it.variant})</span><span>${fmtNPR(it.lineTotal)}</span></div>`;
  }).join('');
  const subtotal = STATE.pendingOrderItems.reduce((a,i)=>a+i.regularLineTotal,0);
  const discount = STATE.pendingOrderItems.reduce((a,i)=>a+(i.regularLineTotal-i.lineTotal),0);
  const total = subtotal-discount;

  document.getElementById('panelOverlay').innerHTML = `
    <div class="panel">
      <div class="panel-head"><h3 style="margin:0;font-size:16px;">Create Order</h3><button class="close-x" onclick="closePanel()">${icon('close')}</button></div>

        <div class="field"><label>Customer</label>
          <div class="pick-row" style="background:var(--bg);">
            <div class="conv-avatar">${conv?conv.name.split(' ').map(w=>w[0]).join('').slice(0,2):'--'}</div>
            <div class="pick-info"><div class="pick-name">${conv?conv.name:'—'}</div><div class="pick-meta">${conv?conv.handle:''} · auto-filled from Instagram</div></div>
          </div>
        </div>
        <div class="section-title" style="margin-top:16px;">Select products</div>
        <div class="section-sub">Offer prices are shown automatically when active</div>
        ${rows}
        ${STATE.pendingOrderItems.length ? `<div class="section-title" style="margin-top:18px;">Order summary</div>${summary}
          <div class="summary-row discount"><span>Discount</span><span>-${fmtNPR(discount)}</span></div>
          <div class="summary-row total"><span>Total</span><span>${fmtNPR(total)}</span></div>` : ''}
      </div>
      <div class="panel-foot">
        <button class="btn btn-secondary" onclick="closePanel()">Cancel</button>
        <button class="btn btn-primary" ${STATE.pendingOrderItems.length?'':'disabled style="opacity:.5;"'} onclick="submitOrder()">${icon('check')} Create Order</button>
      </div>
    </div>`;
}
function pickVariant(pid){
  const p = PRODUCTS.find(x=>x.id===pid);
  const variantOpts = p.variants.map(v=>`${v.size} / ${v.color} — ${v.stock>0?v.stock+' in stock':'OUT OF STOCK'}`);
  const choice = prompt('Choose variant for '+p.name+':\\n'+variantOpts.map((v,i)=>(i+1)+'. '+v).join('\\n')+'\\n\\nEnter number:');
  const idx = parseInt(choice)-1;
  if(isNaN(idx) || !p.variants[idx]) return;
  const v = p.variants[idx];
  if(v.stock<=0){ toast('That variant is out of stock'); return; }
  const dp = discountedPrice(p);
  STATE.pendingOrderItems.push({productId:p.id, name:p.name, variant:v.size+' / '+v.color, qty:1, lineTotal:dp, regularLineTotal:p.price});
  renderCreateOrderPanel();
}
window.pickVariant = pickVariant;
function closePanel(){document.getElementById('panelOverlay').classList.remove('show');}
window.closePanel = closePanel;
function submitOrder(){
  const conv = STATE.pendingOrderConv;
  const subtotal = STATE.pendingOrderItems.reduce((a,i)=>a+i.regularLineTotal,0);
  const discount = STATE.pendingOrderItems.reduce((a,i)=>a+(i.regularLineTotal-i.lineTotal),0);
  const id = 'ORD-'+(1043+ORDERS.length-5);
  ORDERS.unshift({
    id: 'ORD-'+Math.floor(1043+Math.random()*50),
    customer: conv.name, handle: conv.handle,
    items: STATE.pendingOrderItems.map(i=>({name:i.name, variant:i.variant, qty:i.qty, price:i.lineTotal})),
    offer: discount>0?{name:'Applied offer', amount:discount}:null,
    status:'pending', date:'2026-07-24', total: subtotal-discount,
  });
  closePanel();
  toast('Order created successfully');
  navigate('orders');
}
window.submitOrder = submitOrder;

/* ============================= ORDERS ============================= */
function statusPill(status){
  const map = {
    pending:{cls:'pill-neutral', label:'Pending'},
    confirmed:{cls:'pill-info', label:'Confirmed'},
    shipped:{cls:'pill-warning', label:'Shipped'},
    delivered:{cls:'pill-success', label:'Delivered'},
  };
  const m = map[status]||map.pending;
  return `<span class="pill ${m.cls}"><span class="pill-dot" style="background:currentColor;"></span>${m.label}</span>`;
}
function renderOrders(){
  const rows = ORDERS.map(o=>`
    <tr class="clickable" onclick="openOrderDetail('${o.id}')">
      <td class="mono td-title">${o.id}</td>
      <td><div class="td-title">${o.customer}</div><div class="td-sub">${o.handle}</div></td>
      <td>${o.items.length} item${o.items.length>1?'s':''}</td>
      <td>${o.offer?`<span class="price-tag">${o.offer.name}</span>`:'<span class="td-sub">—</span>'}</td>
      <td class="mono">${fmtNPR(o.total)}</td>
      <td>${statusPill(o.status)}</td>
      <td class="td-sub">${o.date}</td>
    </tr>`).join('');
  return `
    <div class="page-head">
      <div><h1>Orders</h1><p class="page-sub">${ORDERS.length} total orders</p></div>
      <button class="btn btn-primary" onclick="navigate('inbox')">${icon('plus')} New order from Inbox</button>
    </div>
    <div class="card">
      <table class="tbl">
        <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Offer</th><th>Total</th><th>Status</th><th>Date</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}
function openOrderDetail(id){ STATE.orderDetailId = id; renderAll(); }
window.openOrderDetail = openOrderDetail;

function renderOrderDetail(){
  const o = ORDERS.find(x=>x.id===STATE.orderDetailId);
  if(!o) return renderOrders();
  const steps = ['pending','confirmed','shipped','delivered'];
  const curIdx = steps.indexOf(o.status);
  const stepsHtml = steps.map((s,i)=>{
    const cls = i<curIdx?'done':(i===curIdx?'current':'');
    return `<div class="tl-step ${cls}">${i>0?'<div class="tl-line"></div>':''}<div class="tl-dot">${i<=curIdx?icon('check'):''}</div><div class="tl-label">${s.charAt(0).toUpperCase()+s.slice(1)}</div></div>`;
  }).join('');

  const itemRows = o.items.map(it=>`
    <div class="pick-row">
      <div class="pick-info"><div class="pick-name">${it.name}</div><div class="pick-meta">${it.variant} · Qty ${it.qty}</div></div>
      <div class="price-reg">${fmtNPR(it.price*it.qty)}</div>
    </div>`).join('');

  const subtotal = o.items.reduce((a,i)=>a+i.price*i.qty,0) + (o.offer?o.offer.amount:0);

  return `
    <div class="page-head">
      <div><button class="btn btn-ghost btn-sm" onclick="STATE.orderDetailId=null;renderAll();" style="margin-bottom:8px;">&larr; Back to orders</button>
      <h1 class="mono">${o.id}</h1><p class="page-sub">Placed on ${o.date} via Instagram DM</p></div>
      ${statusPill(o.status)}
    </div>
    <div class="card card-pad" style="margin-bottom:16px;">
      <div class="timeline">${stepsHtml}</div>
    </div>
    <div class="order-grid">
      <div class="card card-pad">
        <div class="section-title">Items</div>
        <div class="section-sub">Product and variant breakdown</div>
        ${itemRows}
        <div class="summary-row" style="margin-top:10px;"><span>Subtotal</span><span>${fmtNPR(subtotal)}</span></div>
        ${o.offer?`<div class="summary-row discount"><span>${o.offer.name}</span><span>-${fmtNPR(o.offer.amount)}</span></div>`:''}
        <div class="summary-row total"><span>Total</span><span>${fmtNPR(o.total)}</span></div>
      </div>
      <div class="card card-pad">
        <div class="section-title">Customer</div>
        <div class="pick-row" style="background:var(--bg);margin-top:10px;">
          <div class="conv-avatar">${o.customer.split(' ').map(w=>w[0]).join('').slice(0,2)}</div>
          <div class="pick-info"><div class="pick-name">${o.customer}</div><div class="pick-meta">${o.handle} · via Instagram</div></div>
        </div>
        <div class="section-title" style="margin-top:18px;">Update status</div>
        <div class="chip-row" style="margin-top:8px;">
          ${steps.map(s=>`<div class="chip ${o.status===s?'sel':''}" onclick="setOrderStatus('${o.id}','${s}')">${s.charAt(0).toUpperCase()+s.slice(1)}</div>`).join('')}
        </div>
      </div>
    </div>`;
}
function setOrderStatus(id, status){
  const o = ORDERS.find(x=>x.id===id);
  o.status = status;
  toast('Order status updated to '+status);
  renderAll();
}
window.setOrderStatus = setOrderStatus;

/* ============================= INVENTORY ============================= */
function margin(p){
  // profit margin % on selling price
  if(!p.price) return 0;
  return Math.round(((p.price-p.cost)/p.price)*100);
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-US',{month:'short', day:'numeric', year:'numeric'});
}
const TODAY = '2026-07-28';
function renderInventory(){
  if(STATE.inventoryLoading){
    let skelRows = Array.from({length:5}).map(()=>`
      <tr><td><div class="td-flex"><div class="skeleton" style="width:38px;height:38px;border-radius:7px;"></div>
      <div style="flex:1;"><div class="skeleton" style="width:60%;height:11px;margin-bottom:6px;"></div><div class="skeleton" style="width:40%;height:10px;"></div></div></div></td>
      <td><div class="skeleton" style="width:60px;height:11px;"></div></td><td><div class="skeleton" style="width:80px;height:11px;"></div></td>
      <td><div class="skeleton" style="width:70px;height:11px;"></div></td><td><div class="skeleton" style="width:70px;height:11px;"></div></td><td><div class="skeleton" style="width:50px;height:11px;"></div></td><td></td></tr>`).join('');
    return `<div class="page-head"><div><h1>Inventory</h1><p class="page-sub">Loading products…</p></div></div>
      <div class="card"><table class="tbl"><thead><tr><th>Product</th><th>SKU</th><th>Category</th><th>Pricing</th><th>Stock dates</th><th>Status</th><th></th></tr></thead>
      <tbody>${skelRows}</tbody></table></div>`;
  }

  let list = [...PRODUCTS];
  if(STATE.invSort.key){
    list.sort((a,b)=>{
      let av = STATE.invSort.key==='stock' ? a.variants.reduce((s,v)=>s+v.stock,0) : (STATE.invSort.key==='margin' ? margin(a) : a[STATE.invSort.key]);
      let bv = STATE.invSort.key==='stock' ? b.variants.reduce((s,v)=>s+v.stock,0) : (STATE.invSort.key==='margin' ? margin(b) : b[STATE.invSort.key]);
      if(typeof av==='string') return av.localeCompare(bv)*STATE.invSort.dir;
      return (av-bv)*STATE.invSort.dir;
    });
  }

  const arrow = k => STATE.invSort.key===k ? `<span class="sort-arrow">${STATE.invSort.dir>0?'▲':'▼'}</span>` : '';

  // Portfolio-level profit summary across current stock on hand
  const totalCostValue = PRODUCTS.reduce((sum,p)=>sum + p.cost * p.variants.reduce((s,v)=>s+v.stock,0), 0);
  const totalSellValue = PRODUCTS.reduce((sum,p)=>sum + p.price * p.variants.reduce((s,v)=>s+v.stock,0), 0);
  const totalPotentialProfit = totalSellValue - totalCostValue;
  const blendedMargin = totalSellValue ? Math.round((totalPotentialProfit/totalSellValue)*100) : 0;

  const rows = list.length ? list.map(p=>{
    const totalStock = p.variants.reduce((s,v)=>s+v.stock,0);
    const lowVariants = p.variants.filter(v=>v.stock<=v.reorder).length;
    const expanded = STATE.expandedProducts.has(p.id);
    const m = margin(p);
    const profitPerUnit = p.price - p.cost;
    const restockOverdue = p.nextRestock && p.nextRestock < TODAY;
    const variantRows = p.variants.map(v=>`
      <tr>
        <td>${v.size}</td><td>${v.color}</td>
        <td class="mono">${v.stock}</td>
        <td class="mono">${fmtNPR(profitPerUnit * v.stock)}</td>
        <td>${v.stock<=v.reorder ? `<span class="pill pill-danger"><span class="pill-dot" style="background:currentColor;"></span>Reorder (≤${v.reorder})</span>` : `<span class="pill pill-success"><span class="pill-dot" style="background:currentColor;"></span>Healthy</span>`}</td>
      </tr>`).join('');
    return `
    <tr class="clickable" onclick="toggleExpand('${p.id}')">
      <td><div class="td-flex"><span class="chevron ${expanded?'open':''}">${icon('chevron')}</span><img src="${p.img}" class="thumb"><div><div class="td-title">${p.name} ${p.onOffer?'<span class="price-tag">ON OFFER</span>':''}</div><div class="td-sub">${totalStock} units across ${p.variants.length} variants</div></div></div></td>
      <td class="mono">${p.sku}</td>
      <td>${p.category}</td>
      <td>
        <div class="td-sub">Cost <span class="mono">${fmtNPR(p.cost)}</span></div>
        <div class="td-title mono">${fmtNPR(p.price)}</div>
        <div class="td-sub">${m}% margin · ${fmtNPR(profitPerUnit)}/unit</div>
      </td>
      <td>
        <div class="td-sub">Stocked ${fmtDate(p.stockedOn)}</div>
        <div class="${restockOverdue?'':'td-title'}" style="${restockOverdue?'color:var(--danger);font-weight:700;font-size:13px;':''}">${restockOverdue?'⚠ ':''}Restock ${fmtDate(p.nextRestock)}</div>
      </td>
      <td>${lowVariants>0?`<span class="pill pill-warning"><span class="pill-dot" style="background:currentColor;"></span>${lowVariants} low stock</span>`:`<span class="pill pill-success"><span class="pill-dot" style="background:currentColor;"></span>In stock</span>`}</td>
      <td><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openProductModal('${p.id}')">${icon('edit')} Edit</button></td>
    </tr>
    <tr class="expand-row ${expanded?'':'hidden'}"><td colspan="7">
      <div class="variant-table"><table><thead><tr><th>Size</th><th>Color</th><th>Stock</th><th>Profit potential</th><th>Status</th></tr></thead><tbody>${variantRows}</tbody></table></div>
    </td></tr>`;
  }).join('') : '';

  const body = list.length ? rows : `<tr><td colspan="7"><div class="empty-state">${icon('inventory')}<h3>No products yet</h3><p>Add your first product to start tracking stock and variants.</p><button class="btn btn-primary btn-sm" style="margin-top:12px;" onclick="openProductModal(null)">${icon('plus')} Add product</button></div></td></tr>`;

  return `
    <div class="page-head">
      <div><h1>Inventory</h1><p class="page-sub">${PRODUCTS.length} products · ${PRODUCTS.reduce((a,p)=>a+p.variants.filter(v=>v.stock<=v.reorder).length,0)} variants below reorder level</p></div>
      <button class="btn btn-primary" onclick="openProductModal(null)">${icon('plus')} Add product</button>
    </div>
    <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);">
      <div class="card stat-card">
        <div class="stat-icon" style="background:var(--info-soft);color:var(--info);">${icon('box')}</div>
        <div class="stat-value">${fmtNPR(totalCostValue)}</div>
        <div class="stat-label">Stock on hand — cost value</div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon" style="background:var(--success-soft);color:var(--success);">${icon('money')}</div>
        <div class="stat-value">${fmtNPR(totalSellValue)}</div>
        <div class="stat-label">Stock on hand — sell value</div>
      </div>
      <div class="card stat-card">
        <span class="stat-trend trend-up">${blendedMargin}% margin</span>
        <div class="stat-icon" style="background:var(--accent-soft);color:var(--accent-soft-ink);">${icon('trend')}</div>
        <div class="stat-value">${fmtNPR(totalPotentialProfit)}</div>
        <div class="stat-label">Potential profit if all sold</div>
      </div>
    </div>
    <div class="card">
      <table class="tbl">
        <thead><tr>
          <th class="sortable" onclick="sortInv('name')">Product ${arrow('name')}</th>
          <th class="sortable" onclick="sortInv('sku')">SKU ${arrow('sku')}</th>
          <th class="sortable" onclick="sortInv('category')">Category ${arrow('category')}</th>
          <th class="sortable" onclick="sortInv('margin')">Pricing & margin ${arrow('margin')}</th>
          <th class="sortable" onclick="sortInv('nextRestock')">Stock dates ${arrow('nextRestock')}</th>
          <th class="sortable" onclick="sortInv('stock')">Stock status ${arrow('stock')}</th>
          <th></th>
        </tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>`;
}
function afterInventoryRender(){}
function sortInv(key){
  if(STATE.invSort.key===key) STATE.invSort.dir*=-1;
  else STATE.invSort = {key, dir:1};
  renderAll();
}
window.sortInv = sortInv;
function toggleExpand(pid){
  if(STATE.expandedProducts.has(pid)) STATE.expandedProducts.delete(pid);
  else STATE.expandedProducts.add(pid);
  renderAll();
}
window.toggleExpand = toggleExpand;

function openProductModal(pid){
  const p = pid ? PRODUCTS.find(x=>x.id===pid) : null;
  document.getElementById('modalOverlay').innerHTML = `
    <div class="modal">
      <div class="modal-head"><h3 style="margin:0;font-size:16px;">${p?'Edit product':'Add product'}</h3><button class="close-x" onclick="closeModal()">${icon('close')}</button></div>
      <div class="modal-body">
        <div class="field-row">
          <div class="field"><label>Product name</label><input value="${p?p.name:''}" placeholder="e.g. Sagarmatha Windbreaker"></div>
          <div class="field"><label>SKU</label><input value="${p?p.sku:''}" placeholder="TS-XX-000"></div>
        </div>
        <div class="field"><label>Category</label><select id="pmCategory" onchange="handleCategoryChange(this)">
          ${CATEGORIES.map(c=>`<option value="${c}" ${p&&p.category===c?'selected':''}>${c}</option>`).join('')}
          <option value="__add_new__">+ Add new category…</option>
        </select></div>
        <div class="field">
          <label>Product image</label>
          <div class="image-upload-row">
            <div class="image-preview" id="pmImgPreview" style="${p&&p.img?`background-image:url('${p.img}');`:''}">${p&&p.img?'':icon('image')}</div>
            <div class="image-upload-actions">
              <label class="btn btn-secondary btn-sm" for="pmImgFile">${icon('upload')} Select from device</label>
              <input type="file" id="pmImgFile" accept="image/*" onchange="handleImageUpload(event)">
              <div class="td-sub" id="pmImgFileName">${p&&p.img?'Current product photo':'No file chosen'}</div>
            </div>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Cost price (NPR)</label><input id="pmCost" type="number" value="${p?p.cost:''}" placeholder="1200" oninput="updateModalMargin()"></div>
          <div class="field"><label>Selling price (NPR)</label><input id="pmPrice" type="number" value="${p?p.price:''}" placeholder="2500" oninput="updateModalMargin()"></div>
        </div>
        <div class="field" id="pmMarginRow" style="margin-top:-6px;">
          <div class="pick-row" style="background:var(--bg);justify-content:space-between;">
            <span class="td-sub">Profit per unit</span>
            <span class="td-title mono" id="pmProfit">${p?fmtNPR(p.price-p.cost):'—'}</span>
            <span class="pill pill-success" id="pmMarginPill"><span class="pill-dot" style="background:currentColor;"></span>${p?margin(p):0}% margin</span>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Stocked on</label><input type="date" id="pmStockedOn" value="${p&&p.stockedOn?p.stockedOn:''}"></div>
          <div class="field"><label>Next restock date</label><input type="date" id="pmNextRestock" value="${p&&p.nextRestock?p.nextRestock:''}"></div>
        </div>
        <div class="section-title">Variants (size / color / stock)</div>
        <div class="section-sub">Add each size-color combination separately</div>
        <div class="variant-editor">
          <div class="variant-form-head">
            <span>Size</span><span>Color</span><span>Stock</span><span>Reorder at</span><span></span>
          </div>
          <div id="variantRows">
            ${(p?p.variants:[{size:'',color:'',stock:'',reorder:5}]).map(v=>variantRowHtml(v)).join('')}
          </div>
          <div class="variant-editor-foot">
            <button class="btn btn-secondary btn-sm" onclick="addVariantRow()">${icon('plus')} Add variant</button>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveProductModal('${p?p.id:''}')">${icon('check')} Save product</button>
      </div>
    </div>`;
  document.getElementById('modalOverlay').classList.add('show');
}
window.openProductModal = openProductModal;
function variantRowHtml(v){
  return `<div class="variant-row">
    <input placeholder="S / M / L" value="${v.size}">
    <input placeholder="Black" value="${v.color}">
    <input placeholder="0" type="number" value="${v.stock}">
    <input placeholder="5" type="number" value="${v.reorder}">
    <button type="button" class="variant-remove-btn" onclick="removeVariantRow(this)" title="Remove variant">${icon('trash')}</button>
  </div>`;
}
function addVariantRow(){
  document.getElementById('variantRows').insertAdjacentHTML('beforeend', variantRowHtml({size:'',color:'',stock:'',reorder:5}));
}
window.addVariantRow = addVariantRow;
function removeVariantRow(btn){
  const rows = document.getElementById('variantRows');
  if(rows.children.length<=1){ toast('A product needs at least one variant'); return; }
  btn.closest('.variant-row').remove();
}
window.removeVariantRow = removeVariantRow;
function updateModalMargin(){
  const cost = parseFloat(document.getElementById('pmCost').value)||0;
  const price = parseFloat(document.getElementById('pmPrice').value)||0;
  const profit = price-cost;
  const m = price ? Math.round((profit/price)*100) : 0;
  document.getElementById('pmProfit').textContent = fmtNPR(profit);
  const pill = document.getElementById('pmMarginPill');
  pill.innerHTML = '<span class="pill-dot" style="background:currentColor;"></span>'+m+'% margin';
  pill.className = 'pill ' + (m<0?'pill-danger':m<25?'pill-warning':'pill-success');
}
window.updateModalMargin = updateModalMargin;
let pendingProductImage = null;
function handleImageUpload(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Please choose an image file'); return; }
  const reader = new FileReader();
  reader.onload = e=>{
    pendingProductImage = e.target.result;
    const preview = document.getElementById('pmImgPreview');
    preview.style.backgroundImage = `url('${pendingProductImage}')`;
    preview.innerHTML = '';
    document.getElementById('pmImgFileName').textContent = file.name;
  };
  reader.readAsDataURL(file);
}
window.handleImageUpload = handleImageUpload;
function handleCategoryChange(sel){
  if(sel.value==='__add_new__'){
    const name = prompt('New category name:');
    if(name && name.trim()){
      const clean = name.trim();
      if(!CATEGORIES.includes(clean)) CATEGORIES.push(clean);
      const opt = document.createElement('option');
      opt.value = clean; opt.textContent = clean;
      sel.insertBefore(opt, sel.lastElementChild);
      sel.value = clean;
    } else {
      sel.value = CATEGORIES[0];
    }
  }
}
window.handleCategoryChange = handleCategoryChange;
function saveProductModal(pid){
  const cost = parseFloat(document.getElementById('pmCost').value)||0;
  const price = parseFloat(document.getElementById('pmPrice').value)||0;
  const category = document.getElementById('pmCategory').value;
  const stockedOn = document.getElementById('pmStockedOn').value;
  const nextRestock = document.getElementById('pmNextRestock').value;
  if(pid){
    const p = PRODUCTS.find(x=>x.id===pid);
    if(p){
      p.cost = cost; p.price = price; p.category = category;
      if(stockedOn) p.stockedOn = stockedOn;
      if(nextRestock) p.nextRestock = nextRestock;
      if(pendingProductImage) p.img = pendingProductImage;
    }
  }
  pendingProductImage = null;
  closeModal();
  toast('Product saved');
  renderAll();
}
window.saveProductModal = saveProductModal;
function closeModal(){pendingProductImage=null;document.getElementById('modalOverlay').classList.remove('show');}
window.closeModal = closeModal;

/* ============================= OFFERS ============================= */
function offerStatusPill(status){
  const map = {active:{cls:'pill-success',label:'Active'}, scheduled:{cls:'pill-info',label:'Scheduled'}, expired:{cls:'pill-neutral',label:'Expired'}};
  const m = map[status];
  return `<span class="pill ${m.cls}"><span class="pill-dot" style="background:currentColor;"></span>${m.label}</span>`;
}
function itemLabel(it){
  return it.type==='percent' ? it.value+'% off' : 'Flat '+fmtNPR(it.value)+' off';
}
function offerItemsCell(o){
  const max = 3;
  const shown = o.items.slice(0,max);
  const lines = shown.map(it=>{
    const p = PRODUCTS.find(x=>x.id===it.productId);
    return `<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:3px;">
      <span class="td-sub" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;">${p?p.name:it.productId}</span>
      <span class="price-tag">${itemLabel(it)}</span>
    </div>`;
  }).join('');
  const more = o.items.length>max ? `<div class="td-sub">+${o.items.length-max} more product${o.items.length-max>1?'s':''}</div>` : '';
  return lines+more;
}
function renderOffers(){
  const rows = OFFERS.map(o=>`
    <tr>
      <td><div class="td-title">${o.name}</div><div class="td-sub">${o.items.length} product${o.items.length>1?'s':''} included</div></td>
      <td>${offerItemsCell(o)}</td>
      <td class="td-sub">${o.start} → ${o.end}</td>
      <td>${offerStatusPill(o.status)}</td>
      <td class="mono">${o.redemptions}</td>
      <td class="mono">${fmtNPR(o.revenue)}</td>
      <td><button class="btn btn-ghost btn-sm" onclick="openOfferModal('${o.id}')">${icon('edit')} Edit</button></td>
    </tr>`).join('');
  return `
    <div class="page-head">
      <div><h1>Offers & Promotions</h1><p class="page-sub">${OFFERS.filter(o=>o.status==='active').length} active · ${OFFERS.filter(o=>o.status==='scheduled').length} scheduled</p></div>
      <button class="btn btn-primary" onclick="openOfferModal(null)">${icon('plus')} Create offer</button>
    </div>
    <div class="card">
      <table class="tbl">
        <thead><tr><th>Offer</th><th>Products &amp; discount</th><th>Duration</th><th>Status</th><th>Redemptions</th><th>Revenue</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}
let offerModalItems = [];
function openOfferModal(oid){
  const o = oid ? OFFERS.find(x=>x.id===oid) : null;
  offerModalItems = o ? o.items.map(it=>({...it})) : [];
  document.getElementById('modalOverlay').innerHTML = `
    <div class="modal">
      <div class="modal-head"><h3 style="margin:0;font-size:16px;">${o?'Edit offer':'Create offer'}</h3><button class="close-x" onclick="closeModal()">${icon('close')}</button></div>
      <div class="modal-body">
        <div class="field"><label>Offer name</label><input id="offerName" value="${o?o.name:''}" placeholder="e.g. Dashain Drop — 20% Off Outerwear"></div>
        <div class="field-row">
          <div class="field"><label>Start date</label><input id="offerStart" type="date" value="${o?o.start:''}"></div>
          <div class="field"><label>End date</label><input id="offerEnd" type="date" value="${o?o.end:''}"></div>
        </div>
        <div class="field">
          <label>Products &amp; per-product discount</label>
          <div class="section-sub" style="margin-bottom:8px;">Add each product and set its own flat or % discount</div>
          <div class="offer-editor">
            <div class="offer-form-head"><span>Product</span><span>Discount type</span><span>Value</span><span>Price preview</span><span></span></div>
            <div id="offerItemRows"></div>
            <div class="offer-editor-foot">
              <select id="offerAddProductSelect"></select>
              <button class="btn btn-secondary btn-sm" onclick="addOfferItem()">${icon('plus')} Add</button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveOfferModal('${o?o.id:''}')">${icon('check')} Save offer</button>
      </div>
    </div>`;
  document.getElementById('modalOverlay').classList.add('show');
  renderOfferItemsEditor();
}
window.openOfferModal = openOfferModal;

function offerRowHtml(item, idx){
  const p = PRODUCTS.find(x=>x.id===item.productId);
  const finalPrice = item.type==='percent' ? Math.round(p.price*(1-item.value/100)) : Math.max(0, p.price-item.value);
  return `<div class="offer-row" data-idx="${idx}">
    <div class="offer-product-name" title="${p.name}">${p.name}</div>
    <select onchange="updateOfferItem(${idx}, 'type', this.value)">
      <option value="percent" ${item.type==='percent'?'selected':''}>% off</option>
      <option value="flat" ${item.type==='flat'?'selected':''}>Flat amount off</option>
    </select>
    <input type="number" value="${item.value}" oninput="updateOfferItem(${idx}, 'value', this.value)">
    <div class="offer-price-preview"><span class="was">${fmtNPR(p.price)}</span><span class="now">${fmtNPR(finalPrice)}</span></div>
    <button type="button" class="variant-remove-btn" onclick="removeOfferItem(${idx})" title="Remove product">${icon('trash')}</button>
  </div>`;
}
function renderOfferItemsEditor(){
  const rowsEl = document.getElementById('offerItemRows');
  rowsEl.innerHTML = offerModalItems.length
    ? offerModalItems.map((it,idx)=>offerRowHtml(it,idx)).join('')
    : `<div class="offer-editor-empty">No products added yet — pick one below to set its discount.</div>`;
  const addSelect = document.getElementById('offerAddProductSelect');
  const remaining = PRODUCTS.filter(p=>!offerModalItems.some(it=>it.productId===p.id));
  addSelect.innerHTML = remaining.length
    ? remaining.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')
    : `<option value="">All products added</option>`;
  addSelect.disabled = remaining.length===0;
}
function addOfferItem(){
  const sel = document.getElementById('offerAddProductSelect');
  if(!sel.value) return;
  offerModalItems.push({productId:sel.value, type:'percent', value:10});
  renderOfferItemsEditor();
}
window.addOfferItem = addOfferItem;
function updateOfferItem(idx, field, value){
  offerModalItems[idx][field] = field==='value' ? (parseFloat(value)||0) : value;
  renderOfferItemsEditor();
}
window.updateOfferItem = updateOfferItem;
function removeOfferItem(idx){
  offerModalItems.splice(idx,1);
  renderOfferItemsEditor();
}
window.removeOfferItem = removeOfferItem;
function saveOfferModal(oid){
  const name = document.getElementById('offerName').value.trim();
  const start = document.getElementById('offerStart').value;
  const end = document.getElementById('offerEnd').value;
  if(!offerModalItems.length){ toast('Add at least one product to the offer'); return; }
  if(oid){
    const o = OFFERS.find(x=>x.id===oid);
    if(o){ if(name) o.name=name; if(start) o.start=start; if(end) o.end=end; o.items = offerModalItems.map(it=>({...it})); }
  } else {
    OFFERS.unshift({id:'o'+(OFFERS.length+1)+Math.floor(Math.random()*999), name: name||'New offer', status:'scheduled',
      start: start||TODAY, end: end||TODAY, items: offerModalItems.map(it=>({...it})), redemptions:0, revenue:0});
  }
  closeModal();
  toast('Offer saved');
  renderAll();
}
window.saveOfferModal = saveOfferModal;

/* ============================= SHIPMENTS ============================= */
function shipStatusPill(status){
  const map = {
    'not-created':{cls:'pill-neutral', label:'Not created'},
    'in-transit':{cls:'pill-warning', label:'In transit'},
    'delivered':{cls:'pill-success', label:'Delivered'},
  };
  const m = map[status];
  return `<span class="pill ${m.cls}"><span class="pill-dot" style="background:currentColor;"></span>${m.label}</span>`;
}
function renderShipments(){
  const rows = SHIPMENTS.map(s=>`
    <tr>
      <td class="mono td-title">${s.order}</td>
      <td>${s.customer}</td>
      <td>${s.ncm?`<span class="mono">${s.ncm}</span>`:'<span class="td-sub">—</span>'}</td>
      <td>${s.dest}</td>
      <td>${shipStatusPill(s.status)}</td>
      <td class="td-sub">${s.created}</td>
      <td>${s.ncm ? `<button class="btn btn-secondary btn-sm">Track</button>` : `<button class="btn btn-primary btn-sm" onclick="createNCM('${s.order}')">${icon('truck')} Create NCM Shipment</button>`}</td>
    </tr>`).join('');
  return `
    <div class="page-head">
      <div><h1>Shipments</h1><p class="page-sub">NCM (Nepal Can Move) courier tracking for all orders</p></div>
    </div>
    <div class="card">
      <table class="tbl">
        <thead><tr><th>Order</th><th>Customer</th><th>NCM Tracking #</th><th>Destination</th><th>Status</th><th>Created</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}
function createNCM(orderId){
  const s = SHIPMENTS.find(x=>x.order===orderId);
  s.ncm = 'NCM-'+ (88000+Math.floor(Math.random()*999));
  s.status = 'in-transit';
  const o = ORDERS.find(x=>x.id===orderId);
  if(o) o.status='shipped';
  toast('NCM shipment created — '+s.ncm);
  renderAll();
}
window.createNCM = createNCM;

/* ============================= EMPLOYEES ============================= */
function renderEmployees(){
  const tab = STATE.employeeTab;
  let body='';
  if(tab==='roster'){
    body = EMPLOYEES.map(e=>`
      <div class="emp-card">
        <div class="emp-avatar">${e.name.split(' ').map(w=>w[0]).join('').slice(0,2)}</div>
        <div style="flex:1;"><div class="td-title">${e.name}</div><div class="td-sub">${e.role} · joined ${e.joined}</div></div>
        <span class="pill ${e.attendance==='Present'?'pill-success':e.attendance==='On Leave'?'pill-warning':'pill-danger'}"><span class="pill-dot" style="background:currentColor;"></span>${e.attendance}</span>
        <div style="width:110px;text-align:right;"><div class="td-sub">Performance</div><div class="td-title">${e.performance}%</div></div>
      </div>`).join('');
  } else if(tab==='attendance'){
    body = `<table class="tbl"><thead><tr><th>Employee</th><th>Today's Status</th><th>This Month</th><th>Late Arrivals</th></tr></thead><tbody>
      ${EMPLOYEES.map(e=>`<tr><td class="td-title">${e.name}</td><td>${statusChip(e.attendance)}</td><td class="mono">22/24 days</td><td class="mono">${Math.floor(Math.random()*3)}</td></tr>`).join('')}
      </tbody></table>`;
  } else if(tab==='leave'){
    body = `<table class="tbl"><thead><tr><th>Employee</th><th>Type</th><th>Dates</th><th>Status</th><th></th></tr></thead><tbody>
      ${LEAVE_REQUESTS.map(l=>`<tr><td class="td-title">${l.name}</td><td>${l.type}</td><td>${l.dates}</td>
      <td><span class="pill ${l.status==='approved'?'pill-success':'pill-warning'}"><span class="pill-dot" style="background:currentColor;"></span>${l.status.charAt(0).toUpperCase()+l.status.slice(1)}</span></td>
      <td>${l.status==='pending'?`<button class="btn btn-secondary btn-sm">Approve</button>`:''}</td></tr>`).join('')}
      </tbody></table>`;
  } else if(tab==='payroll'){
    body = `<table class="tbl"><thead><tr><th>Employee</th><th>Role</th><th>Base Pay</th><th>Performance Bonus</th><th>Net Pay (Est.)</th></tr></thead><tbody>
      ${EMPLOYEES.map(e=>{const base=25000+e.performance*150; const bonus=Math.round(base*(e.performance/100)*0.1);
      return `<tr><td class="td-title">${e.name}</td><td>${e.role}</td><td class="mono">${fmtNPR(base)}</td><td class="mono">${fmtNPR(bonus)}</td><td class="mono td-title">${fmtNPR(base+bonus)}</td></tr>`;}).join('')}
      </tbody></table>`;
  }
  return `
    <div class="page-head">
      <div><h1>Employees</h1><p class="page-sub">${EMPLOYEES.length} team members</p></div>
      <button class="btn btn-primary">${icon('plus')} Add employee</button>
    </div>
    <div class="tabs">
      ${['roster','attendance','leave','payroll'].map(t=>`<div class="tab ${tab===t?'active':''}" onclick="STATE.employeeTab='${t}';renderAll();">${t.charAt(0).toUpperCase()+t.slice(1)}${t==='leave'?' Requests':''}</div>`).join('')}
    </div>
    <div class="card ${tab==='roster'?'':'card-pad'}" style="${tab==='roster'?'':''}">${tab==='roster'?body:body}</div>`;
}
function statusChip(s){
  const cls = s==='Present'?'pill-success':s==='On Leave'?'pill-warning':'pill-danger';
  return `<span class="pill ${cls}"><span class="pill-dot" style="background:currentColor;"></span>${s}</span>`;
}

/* ============================= REPORTS ============================= */
function renderReports(){
  const totalRevenue = ORDERS.reduce((a,o)=>a+o.total,0);
  const statusCounts = {};
  ORDERS.forEach(o=>statusCounts[o.status]=(statusCounts[o.status]||0)+1);

  // Real COGS from actual order line items, matched against product cost price
  let totalCOGS = 0;
  ORDERS.forEach(o=>o.items.forEach(it=>{
    const prod = PRODUCTS.find(p=>p.name===it.name);
    if(prod) totalCOGS += prod.cost * it.qty;
  }));
  const grossProfit = totalRevenue - totalCOGS;
  const grossMarginPct = totalRevenue ? Math.round((grossProfit/totalRevenue)*100) : 0;

  const topProducts = [...PRODUCTS].map(p=>{
    const sold = Math.floor(Math.random()*40)+10;
    const revenue = sold*p.price;
    const profit = sold*(p.price-p.cost);
    return {name:p.name, sold, revenue, profit};
  }).sort((a,b)=>b.revenue-a.revenue).slice(0,5);

  return `
    <div class="page-head">
      <div><h1>Reports</h1><p class="page-sub">Performance overview for the last 30 days</p></div>
      <button class="btn btn-secondary" onclick="toast('Summary exported as CSV')">${icon('download')} Export summary</button>
    </div>
    <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);">
      <div class="card stat-card">
        <div class="stat-icon" style="background:var(--success-soft);color:var(--success);">${icon('money')}</div>
        <div class="stat-value">${fmtNPR(totalRevenue)}</div>
        <div class="stat-label">Revenue (from orders)</div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon" style="background:var(--info-soft);color:var(--info);">${icon('box')}</div>
        <div class="stat-value">${fmtNPR(totalCOGS)}</div>
        <div class="stat-label">Cost of goods sold</div>
      </div>
      <div class="card stat-card">
        <span class="stat-trend trend-up">${grossMarginPct}% margin</span>
        <div class="stat-icon" style="background:var(--accent-soft);color:var(--accent-soft-ink);">${icon('trend')}</div>
        <div class="stat-value">${fmtNPR(grossProfit)}</div>
        <div class="stat-label">Gross profit</div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon" style="background:var(--warning-soft);color:var(--warning);">${icon('tag')}</div>
        <div class="stat-value">${fmtNPR(OFFERS.reduce((a,o)=>a+o.revenue,0))}</div>
        <div class="stat-label">Revenue via offers</div>
      </div>
    </div>
    <div class="report-grid">
      <div class="card card-pad">
        <div class="section-title">Sales over time</div>
        <div class="section-sub">Daily revenue, last 14 days</div>
        <div class="chart-box"><canvas id="salesChart"></canvas></div>
      </div>
      <div class="card card-pad">
        <div class="section-title">Order status breakdown</div>
        <div class="section-sub">${ORDERS.length} orders total</div>
        <div class="chart-box" style="height:220px;"><canvas id="statusChart"></canvas></div>
      </div>
    </div>
    <div class="report-grid">
      <div class="card card-pad">
        <div class="section-title">Top products</div>
        <div class="section-sub">By revenue this period</div>
        ${topProducts.map((p,i)=>`<div class="top-prod-row"><div class="rank-badge">${i+1}</div>
          <div style="flex:1;"><div class="td-title">${p.name}</div><div class="td-sub">${p.sold} units sold · ${fmtNPR(p.profit)} profit</div></div>
          <div class="mono td-title">${fmtNPR(p.revenue)}</div></div>`).join('')}
      </div>
      <div class="card card-pad">
        <div class="section-title">Offer performance</div>
        <div class="section-sub">Redemptions & revenue impact</div>
        <table class="tbl"><thead><tr><th>Offer</th><th>Redemptions</th><th>Revenue</th></tr></thead><tbody>
          ${OFFERS.map(o=>`<tr><td><span class="price-tag">${o.name.length>28?o.name.slice(0,28)+'…':o.name}</span></td><td class="mono">${o.redemptions}</td><td class="mono">${fmtNPR(o.revenue)}</td></tr>`).join('')}
        </tbody></table>
      </div>
    </div>`;
}
function afterReportsRender(){
  const salesEl = document.getElementById('salesChart');
  if(salesEl && window.Chart){
    const days = Array.from({length:14}).map((_,i)=>{const d=new Date(2026,6,11+i); return d.getDate()+'/'+(d.getMonth()+1);});
    const data = [42000,38500,51000,47500,60200,55000,72300,68000,81500,76200,90100,85300,98700,112400];
    new Chart(salesEl.getContext('2d'), {
      type:'line',
      data:{labels:days, datasets:[{label:'Revenue', data, borderColor:'#EE501F', backgroundColor:'rgba(238,80,31,0.08)', fill:true, tension:0.35, pointRadius:0, borderWidth:2.5}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
        scales:{x:{grid:{display:false}, ticks:{font:{size:10.5}}}, y:{grid:{color:'#EFEEEA'}, ticks:{font:{size:10.5}, callback:v=>v/1000+'k'}}}}
    });
  }
  const statusEl = document.getElementById('statusChart');
  if(statusEl && window.Chart){
    const counts = {pending:0,confirmed:0,shipped:0,delivered:0};
    ORDERS.forEach(o=>counts[o.status]++);
    new Chart(statusEl.getContext('2d'), {
      type:'doughnut',
      data:{labels:['Pending','Confirmed','Shipped','Delivered'], datasets:[{data:[counts.pending,counts.confirmed,counts.shipped,counts.delivered],
        backgroundColor:['#9A9CA3','#2E5AA8','#B4740E','#1D7A56'], borderWidth:0}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{boxWidth:9, font:{size:11}}}}, cutout:'65%'}
    });
  }
}

/* ============================= MODAL OVERLAY CLICK-OUTSIDE ============================= */
document.getElementById('panelOverlay').addEventListener('click', e=>{ if(e.target.id==='panelOverlay') closePanel(); });
document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });

/* ============================= INIT ============================= */
renderAll();
setTimeout(()=>{ STATE.inboxLoading=false; if(STATE.screen==='inbox') renderAll(); }, 900);
setTimeout(()=>{ STATE.inventoryLoading=false; if(STATE.screen==='inventory') renderAll(); }, 900);
// also clear loading flags in background so switching screens later shows loaded content
setTimeout(()=>{ STATE.inboxLoading=false; STATE.inventoryLoading=false; }, 1000);
</script>
</body>
</html>
